<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, height=480, initial-scale=1, user-scalable=no">
    <title>SmartVendo+ Admin</title>
    <meta name="theme-color" content="#16571a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            background-color: #16610e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .login-container {
            background-color: #a0c878;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInScale 0.5s ease-out;
            border: 4px solid #8ab86a;
        }
        
        .login-logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
        }
        
        .login-title {
            font-size: 36px;
            font-weight: 800;
            color: #0a3a0a;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .login-subtitle {
            font-size: 18px;
            color: #1e5a1e;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }
        
        .input-label {
            font-size: 16px;
            color: #0a3a0a;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .input-field {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #8ab86a;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            color: #0a3a0a;
        }
        
        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #0a3a0a, #16610e);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
            text-align: center;
        }
        
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="/static/images/logo1.png" alt="SmartVendo+ Logo" class="login-logo">
        <h1 class="login-title">SMARTVENDO+</h1>
        <div class="login-subtitle">ADMIN PORTAL</div>
        
        <div class="input-group">
            <div class="input-label">Admin Email</div>
            <input type="email" id="adminEmail" class="input-field" placeholder="admin@nu.edu.ph" value="admin@nu.edu.ph">
        </div>
        
        <div class="input-group">
            <div class="input-label">Password</div>
            <input type="password" id="adminPassword" class="input-field" placeholder="Enter password" value="admin123">
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        
        <button id="loginBtn" class="login-btn">LOGIN</button>
    </div>
    
    <script>
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorElement = document.getElementById('errorMessage');
            
            if (!email || !password) {
                errorElement.textContent = 'Please fill in all fields';
                return;
            }
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store token and redirect
                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('admin_email', data.email);
                    window.location.href = '/dashboard';
                } else {
                    errorElement.textContent = data.error || 'Login failed';
                }
            } catch (error) {
                errorElement.textContent = 'Connection error';
            }
        });
        
        // Enter key support
        document.getElementById('adminPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });
    </script>
</body>
</html>
