<!doctype html>
<html lang="en">
<head>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
<script src="{{ url_for('static', filename='js/global.js') }}"></script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=800, height=480, initial-scale=1, user-scalable=no" />
  <title>Layno</title>
  <meta name="theme-color" content="#16571a">
  <style>
    /* Reset + touch-friendly defaults */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; }
    html, body, #root { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      height: 100vh;
      width: 100vw;
      background-color: #16610e; /* fallback green */
      background-image: url("/static/images/background.png");
      background-position: center 28%;
      background-repeat: no-repeat;
      background-size: contain;
      display: flex;
      align-items: flex-end;     /* position CTA toward bottom like your mock */
      justify-content: center;
      padding-bottom: 6vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: default;
      overflow: hidden;
    }

    /* Blocker covers whole screen to ensure only CTA is interactive */
    .blocker {
      position: fixed;
      inset: 0;
      background: transparent;
      z-index: 10;
      pointer-events: auto;
    }

    /* CTA wrapper above the blocker */
    .cta-wrapper {
      z-index: 20;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(2px);
    }

    /* Big, touch-friendly button — sized for a 7" touchscreen */
    .cta {
      appearance: none;
      border: none;
      background: white;
      cursor: pointer;
      font-weight: 800;
      font-size: clamp(20px, 7vw, 40px);
      color: #071406;
      padding: 30px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
      transition: transform 140ms ease, box-shadow 140ms ease;
      -webkit-user-select: none;
      user-select: none;
    }
    .cta:active { transform: scale(0.98); }
    .cta:focus { outline: 3px solid rgba(255,255,255,0.10); transform: translateY(-2px); }

    /* Transient overlay to indicate the press */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 22px;
      z-index: 999;
      backdrop-filter: blur(3px);
    }
    .overlay.show { display: flex; }
  </style>
</head>
<body>
  <!--
    Save your provided image as "background.png" in the same folder as this index.html,
    or update background-image in the CSS to point to your filename/URL.
    The full-screen transparent blocker makes everything non-clickable except the button below.
  -->

  <div class="blocker" aria-hidden="true"></div>

  <div class="cta-wrapper" aria-hidden="false">
    <button id="tapStart" class="cta" aria-label="Tap to Start" type="button">Tap to Start</button>
  </div>

  <div id="overlay" class="overlay" role="status" aria-live="polite">Starting…</div>

  <script>
    (function () {
      const btn = document.getElementById('tapStart');
      const overlay = document.getElementById('overlay');

      // Prevent context menu on long touch/press (helpful on a kiosk touchscreen)
      window.addEventListener('contextmenu', (e) => e.preventDefault());

      function startSequence() {
  overlay.classList.add('show');
  setTimeout(() => { 
    overlay.textContent = 'Welcome to SmartVendo+!'; 
  }, 600);
  
  setTimeout(() => {
    overlay.classList.remove('show');
    // Redirect to the welcome page
    window.location.href = '/welcome';
  }, 1500);
}

      // Only the CTA receives events
      btn.addEventListener('click', startSequence, { passive: true });

      // keyboard / accessibility
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          startSequence();
        }
      });

      // Safe-guard: clicks on blocker do nothing
      document.querySelector('.blocker').addEventListener('click', (e) => {
        e.stopPropagation();
      }, { passive: true });
    }());
  </script>


</body>
</html>
